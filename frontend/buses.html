<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transitpass | Shuttle Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary: #35627A;
            --accent1: #B46258;
            --bg: #F5F5F5;
            --surface: #FFFFFF;
            --text-muted: #8E9A98;
            --text-dark: #2C3E50;
        }

        body { font-family: 'Roboto Slab', serif; background-color: var(--bg); color: var(--text-dark); display: flex; min-height: 100vh; margin: 0; }
        h1, h2, th { font-family: 'Montserrat', sans-serif; font-weight: 700; color: var(--primary); }

        /* Main Content */
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .page-header { margin-bottom: 30px; font-size: 28px; }

        /* Cards & Forms */
        .card { background-color: var(--surface); border-radius: 8px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; color: var(--text-muted); font-size: 14px; margin-bottom: 8px; }
        input { width: 100%; max-width: 400px; padding: 10px 15px; border: 1px solid #A6A9D0; border-radius: 4px; font-family: 'Roboto Slab', serif; color: var(--text-dark); outline: none; }
        input:focus { border-color: var(--primary); }

        /* Buttons */
        .btn { background-color: var(--primary); color: var(--surface); padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-family: 'Montserrat', sans-serif; font-size: 14px; transition: 0.3s; }
        .btn:hover { background-color: var(--accent1); }
        .btn-delete { background-color: var(--accent1); padding: 6px 12px; font-size: 12px; }

        /* Tables */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: var(--bg); color: var(--primary); text-transform: uppercase; font-size: 13px; }
    </style>
</head>
<body>

<!-- Unified Tailwind Sidebar -->
<aside class="w-64 bg-gray-900 text-white h-screen flex flex-col justify-between sticky top-0 shrink-0">
    <div>
        <div class="p-6 text-2xl font-bold border-b border-gray-800" style="font-family: 'Montserrat', sans-serif;">
            Transitpass
        </div>
        <nav class="p-4 space-y-2" style="font-family: 'Roboto Slab', serif;">
            <a href="index.html" class="block py-2 px-4 rounded hover:bg-gray-800 text-gray-400 no-underline">Dashboard</a>
            <a href="bookings.html" class="block py-2 px-4 rounded hover:bg-gray-800 text-gray-400 no-underline">Bookings</a>
            <a href="map.html" class="block py-2 px-4 rounded hover:bg-gray-800 text-gray-400 no-underline">Live Map</a>
            <!-- Active Module -->
            <a href="buses.html" class="block py-2 px-4 rounded no-underline text-white border-l-4" style="background-color: rgba(255,255,255,0.1); border-color: #B46258;">🚌 Shuttle Routes</a>
            <a href="driver.html" class="block py-2 px-4 rounded hover:bg-gray-800 text-gray-400 no-underline">👤 Transit Operators</a>
        </nav>
    </div>

    <!-- Profile UI -->
    <div class="p-4 border-t border-gray-800" style="font-family: 'Roboto Slab', serif;">
        <a href="profile.html" class="flex items-center space-x-3 hover:bg-gray-800 p-2 rounded transition no-underline">
            <div class="w-10 h-10 rounded-full flex items-center justify-center text-lg font-bold text-white shrink-0" style="background-color: #35627A;">
                DK
            </div>
            <div class="overflow-hidden">
                <p class="text-sm font-medium text-white m-0 truncate">Dinuja Akash Kandanearachchi</p>
                <p class="text-xs text-gray-400 m-0 truncate">placeholder@email.com</p>
            </div>
        </a>
    </div>
</aside>

<main class="main-content">
    <h1 class="page-header">Shuttle Fleet Management</h1>

    <div class="card">
        <h2>Deploy New Shuttle</h2>
        <form id="busForm" style="margin-top: 20px;">
            <div class="form-group">
                <label>Registration Number</label>
                <input type="text" id="registrationNumber" placeholder="e.g., NA-1234" required>
            </div>
            <div class="form-group">
                <label>Maximum Passenger Capacity</label>
                <input type="number" id="capacity" placeholder="e.g., 45" required>
            </div>
            <button type="submit" class="btn">Deploy Shuttle</button>
        </form>
    </div>

    <div class="card">
        <h2>Active Shuttle Roster</h2>
        <table>
            <thead>
            <tr>
                <th>Fleet ID</th>
                <th>Registration</th>
                <th>Seating Capacity</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="busTableBody">
            <!-- JavaScript injected data -->
            </tbody>
        </table>
    </div>
</main>

<script>
    const API_BASE_URL = "http://localhost:8080/api/buses";

    async function loadBuses() {
        try {
            const response = await fetch(`${API_BASE_URL}/all`);
            const buses = await response.json();
            const tableBody = document.getElementById('busTableBody');
            tableBody.innerHTML = '';

            buses.forEach(bus => {
                const busId = bus.busId || bus.id;
                const seatCapacity = bus.passengerCapacity !== undefined ? bus.passengerCapacity : 'N/A';

                const row = `<tr>
                    <td><strong>#${busId}</strong></td>
                    <td>${bus.registrationNumber}</td>
                    <td>${seatCapacity} Passengers</td>
                    <td><button class="btn btn-delete" onclick="deleteBus(${busId})">Decommission</button></td>
                </tr>`;
                tableBody.innerHTML += row;
            });
        } catch (error) { console.error("Error loading buses:", error); }
    }

    document.getElementById('busForm').addEventListener('submit', async function(event) {
        event.preventDefault();

        const busData = {
            registrationNumber: document.getElementById('registrationNumber').value,
            passengerCapacity: document.getElementById('capacity').value
        };

        try {
            const response = await fetch(`${API_BASE_URL}/add`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(busData)
            });

            if (response.ok) {
                document.getElementById('busForm').reset();
                loadBuses();
                Swal.fire({ title: 'Success!', text: 'Shuttle deployed successfully.', icon: 'success', confirmButtonColor: '#35627A' });
            } else {
                Swal.fire({ title: 'Error!', text: 'Failed to deploy shuttle.', icon: 'error', confirmButtonColor: '#B46258' });
            }
        } catch (error) { console.error("Error saving bus:", error); }
    });

    async function deleteBus(id) {
        Swal.fire({
            title: 'Decommission Shuttle?',
            text: "This action cannot be undone.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#B46258',
            cancelButtonColor: '#A6A9D0',
            confirmButtonText: 'Yes, decommission it!'
        }).then(async (result) => {
            if (result.isConfirmed) {
                try {
                    const response = await fetch(`${API_BASE_URL}/delete/${id}`, { method: 'DELETE' });
                    if (response.ok) {
                        loadBuses();
                        Swal.fire({ title: 'Decommissioned!', text: 'The shuttle has been removed.', icon: 'success', confirmButtonColor: '#35627A' });
                    } else {
                        Swal.fire('Error', 'Failed to delete shuttle.', 'error');
                    }
                } catch (error) { console.error("Error deleting bus:", error); }
            }
        });
    }

    loadBuses();
</script>
</body>
</html>
