<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Trip Map — TransitPass</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
</head>
<body data-page="map">
  <div id="sidebar"></div>
  <div id="topbar"></div>

  <main class="main">
    <div class="page-wide">
      <div class="map-filter">
        <label for="trip-select">Select a trip</label>
        <select id="trip-select" class="select">
          <option value="">All trips</option>
        </select>
      </div>

      <div id="map-loading" class="map-loading">Loading map data...</div>
      <div id="map-wrapper" class="map-wrapper hidden">
        <div id="map"></div>
      </div>

      <div id="trip-info" class="trip-info trip-info--empty">Select a trip above to see the route</div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
