<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book a Trip — TransitPass</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="book">
  <div id="sidebar"></div>
  <div id="topbar"></div>

  <main class="main">
    <div class="page-book">
      <div class="card">
        <div class="card-header">
          <h2 class="card-title">Reserve Your Seat</h2>
          <span class="pill">Single Pass</span>
        </div>
        <p class="card-subtitle">Select your route, timing, and travel details.</p>

        <div id="book-error" class="error-text"></div>

        <div class="form-group">
          <label class="label" for="trip-select">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            Select Trip Route
          </label>
          <select id="trip-select" class="select">
            <option>Loading...</option>
          </select>
          <div class="hint">Available seats: loading...</div>
        </div>

        <div class="form-group">
          <label class="label" for="travel-date">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            Travel Date
          </label>
          <input type="date" id="travel-date" class="field-input" />
        </div>

        <div class="info-row">
          <span>~75 mins transit</span>
          <span class="info-row__sep">|</span>
          <span>Student ID required</span>
        </div>

        <button id="book-btn" class="btn btn--primary btn--block" style="margin-top:24px;">Book Now</button>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/book.js"></script>
</body>
</html>
