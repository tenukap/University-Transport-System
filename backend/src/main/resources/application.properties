spring.application.name=campus-travelling-system
server.port=8080
spring.jackson.default-property-inclusion=non_null
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# SQL Server. Override with DB_URL, DB_USERNAME, and DB_PASSWORD in IntelliJ Run Configuration if needed.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=CampusTransportDB;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:fleettrack}
spring.datasource.password=${DB_PASSWORD:FleetTrack@2026!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.sql.init.mode=never

app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:8}
app.auth.admin-emails=${ADMIN_EMAILS:admin@campus.edu,doanee315@gmail.com,doane315@gmail.com}
