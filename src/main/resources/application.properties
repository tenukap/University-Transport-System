spring.application.name=uni_transport_system

spring.datasource.url = jdbc:sqlserver://localhost:1433;databaseName=utms_db;encrypt=true;trustServerCertificate=true
spring.datasource.username = sa
spring.datasource.password=DockerSSMS1234

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# Use @Column names verbatim. The DB mixes PascalCase (bustrip, location) with
# snake_case (booking, student). The default strategy rewrites explicit column
# names (e.g. TripId -> trip_id), which breaks schema validation.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration