spring.application.name=campus-travelling-system
server.port=8080
spring.jackson.default-property-inclusion=non_null
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# SQL Server. Override with DB_URL, DB_USERNAME, and DB_PASSWORD in IntelliJ Run Configuration if needed.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=utms_db;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:SA}
spring.datasource.password=${DB_PASSWORD:DockerSSMS1234}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.sql.init.mode=never

# Use @Column names exactly as written (no snake_case conversion).
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Flyway: baseline at 0 so V1 (schema) also runs on a fresh/empty database.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:8}
app.auth.admin-emails=${ADMIN_EMAILS:admin@campus.edu,doanee315@gmail.com,doane315@gmail.com}

# Flat fare applied to every confirmed booking (LKR).
booking.fare=150.00

# Bank slip upload directory (override with app.slip-dir env var in production).
app.slip-dir=./uploads/slips

# Multipart: allow bank slip files up to 5 MB (plus headroom for form fields).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# SQL query logging (debugging).
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
