<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home — UniTransport</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .home-hero { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .home-hero h2 { font-size: 26px; margin: 0; color: var(--text-primary); }
    .home-hero p { color: var(--text-muted); margin: 6px 0 0; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 24px; }
    .tile { display: flex; align-items: flex-start; gap: 14px; text-decoration: none; color: inherit; background: var(--surface); border-radius: 10px; padding: 22px; box-shadow: 0 1px 3px rgba(0,0,0,.08); transition: transform .12s ease, box-shadow .12s ease; }
    .tile:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(53,98,122,.15); }
    .tile__icon { width: 44px; height: 44px; border-radius: 10px; background: rgba(53,98,122,.1); color: var(--primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .tile__title { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 16px; }
    .tile__desc { color: var(--text-muted); font-size: 13px; margin-top: 4px; }
  </style>
</head>
<body data-page="home">
  <div id="sidebar"></div>
  <div id="topbar"></div>

  <main class="main">
    <div class="page-wide">
      <div class="card">
        <div class="home-hero">
          <div>
            <h2>Welcome back, <span id="student-name">Student</span> 👋</h2>
            <p>Manage your campus transport — book a seat, track trips, and view your bookings.</p>
          </div>
          <button class="btn btn--outline" id="home-logout">Logout</button>
        </div>
      </div>

      <div class="tiles">
        <a class="tile" href="book.html">
          <div class="tile__icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
          <div><div class="tile__title">Book a Trip</div><div class="tile__desc">Reserve a seat on an upcoming route.</div></div>
        </a>
        <a class="tile" href="bookings.html">
          <div class="tile__icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>
          <div><div class="tile__title">My Bookings</div><div class="tile__desc">View and cancel your reservations.</div></div>
        </a>
        <a class="tile" href="map.html">
          <div class="tile__icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg></div>
          <div><div class="tile__title">Live Trip Map</div><div class="tile__desc">See routes and stops on the map.</div></div>
        </a>
        <a class="tile" href="profile.html">
          <div class="tile__icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
          <div><div class="tile__title">My Profile</div><div class="tile__desc">Update your details.</div></div>
        </a>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Guard: student-only. Redirects to login.html if not a signed-in STUDENT.
    if (checkAuth('STUDENT')) {
      const u = JSON.parse(localStorage.getItem('user') || 'null');
      document.getElementById('student-name').textContent = (u && (u.fullName || u.name)) || 'Student';
      document.getElementById('home-logout').addEventListener('click', logout);
    }
  </script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
</body>
</html>
