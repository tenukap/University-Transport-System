<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTMS | Driver Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
    <!-- Import SweetAlert2 for professional popups -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary: #35627A;
            --accent1: #B46258;
            --accent2: #E5AEA9;
            --muted: #A6A9D0;
            --bg: #F5F5F5;
            --surface: #FFFFFF;
            --text-muted: #8E9A98;
            --text-dark: #2C3E50;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { font-family: 'Roboto Slab', serif; background-color: var(--bg); color: var(--text-dark); display: flex; min-height: 100vh; }
        h1, h2, h3, th { font-family: 'Montserrat', sans-serif; font-weight: 700; color: var(--primary); }

        /* Sidebar Navigation */
        .sidebar { width: 250px; background-color: var(--primary); color: var(--surface); display: flex; flex-direction: column; padding: 20px 0; }
        .sidebar-brand { font-family: 'Montserrat', sans-serif; font-size: 24px; padding: 0 20px 30px; border-bottom: 1px solid var(--muted); margin-bottom: 20px; }
        .nav-link { padding: 15px 20px; color: var(--muted); text-decoration: none; font-size: 16px; transition: 0.3s; }
        .nav-link:hover { background-color: rgba(255,255,255,0.1); color: var(--accent2); }
        .nav-link.active { background-color: rgba(255,255,255,0.1); color: var(--surface); border-left: 4px solid var(--accent1); }

        /* Main Content */
        .main-content { flex: 1; padding: 40px; }
        .page-header { margin-bottom: 30px; font-size: 28px; }

        /* Cards & Forms */
        .card { background-color: var(--surface); border-radius: 8px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; color: var(--text-muted); font-size: 14px; margin-bottom: 8px; }
        input { width: 100%; max-width: 400px; padding: 10px 15px; border: 1px solid var(--muted); border-radius: 4px; font-family: 'Roboto Slab', serif; color: var(--text-dark); outline: none; }
        input:focus { border-color: var(--primary); }
        input::placeholder { color: var(--text-muted); }

        /* Buttons */
        .btn { background-color: var(--primary); color: var(--surface); padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-family: 'Montserrat', sans-serif; font-size: 14px; transition: 0.3s; }
        .btn:hover { background-color: var(--accent1); }
        .btn-delete { background-color: var(--accent1); padding: 6px 12px; font-size: 12px; }
        .btn-delete:hover { background-color: var(--accent2); color: var(--text-dark); }

        /* Tables */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: var(--bg); color: var(--primary); text-transform: uppercase; font-size: 13px; }
        td { font-size: 15px; color: var(--text-dark); }
        tr:hover { background-color: #fcfcfc; }

        /* Custom SweetAlert Font */
        .swal2-popup { font-family: 'Roboto Slab', serif; }
        .swal2-title { font-family: 'Montserrat', sans-serif; color: var(--primary); }
    </style>
</head>
<body>

<nav class="sidebar">
    <div class="sidebar-brand">UTMS Fleet</div>
    <a href="buses.html" class="nav-link">🚌 Shuttle Routes</a>
    <a href="drivers.html" class="nav-link active">👤 Transit Operators</a>
</nav>

<main class="main-content">
    <h1 class="page-header">Transit Operators (Drivers)</h1>

    <div class="card">
        <h2>Assign New Operator</h2>
        <form id="driverForm" style="margin-top: 20px;">
            <div class="form-group">
                <label>User ID</label>
                <input type="number" id="userId" placeholder="Enter valid User ID" required>
            </div>
            <div class="form-group">
                <label>License Number</label>
                <input type="text" id="licenseNumber" placeholder="e.g., B-9876543" required>
            </div>
            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" id="dob" required>
            </div>
            <button type="submit" class="btn">Register Operator</button>
        </form>
    </div>

    <div class="card">
        <h2>Active Operator Roster</h2>
        <table>
            <thead>
            <tr>
                <th>User ID</th>
                <th>License Number</th>
                <th>Date of Birth</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="driverTableBody">
            <!-- JavaScript injected data -->
            </tbody>
        </table>
    </div>
</main>

<script>
    const API_BASE_URL = "http://localhost:8080/api/drivers";

    async function loadDrivers() {
        try {
            const response = await fetch(`${API_BASE_URL}/all`);
            const drivers = await response.json();
            const tableBody = document.getElementById('driverTableBody');
            tableBody.innerHTML = '';

            drivers.forEach(driver => {
                const statusBadge = driver.status ? driver.status : 'Active';
                const row = `<tr>
                    <td><strong>#${driver.userId}</strong></td>
                    <td>${driver.licenseNumber}</td>
                    <td>${driver.dob}</td>
                    <td><span style="color: var(--accent1); font-weight: bold;">${statusBadge}</span></td>
                    <td><button class="btn btn-delete" onclick="deleteDriver(${driver.userId})">Remove</button></td>
                </tr>`;
                tableBody.innerHTML += row;
            });
        } catch (error) { console.error("Error loading drivers:", error); }
    }

    document.getElementById('driverForm').addEventListener('submit', async function(event) {
        event.preventDefault();
        const driverData = {
            userId: document.getElementById('userId').value,
            licenseNumber: document.getElementById('licenseNumber').value,
            dob: document.getElementById('dob').value
        };

        try {
            const response = await fetch(`${API_BASE_URL}/add`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(driverData)
            });

            if (response.ok) {
                document.getElementById('driverForm').reset();
                loadDrivers();
                Swal.fire({
                    title: 'Operator Registered!',
                    text: 'The driver has been successfully added to the roster.',
                    icon: 'success',
                    confirmButtonColor: '#35627A'
                });
            } else {
                Swal.fire({
                    title: 'Registration Failed',
                    text: 'Ensure the User ID exists in the central database.',
                    icon: 'error',
                    confirmButtonColor: '#B46258'
                });
            }
        } catch (error) { console.error("Error saving driver:", error); }
    });

    async function deleteDriver(id) {
        Swal.fire({
            title: 'Revoke Operator Access?',
            text: "This action cannot be undone.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#B46258', // Red accent
            cancelButtonColor: '#A6A9D0',  // Muted grey
            confirmButtonText: 'Yes, revoke access!'
        }).then(async (result) => {
            if (result.isConfirmed) {
                try {
                    const response = await fetch(`${API_BASE_URL}/delete/${id}`, { method: 'DELETE' });
                    if (response.ok) {
                        loadDrivers();
                        Swal.fire({
                            title: 'Removed!',
                            text: 'The operator access has been revoked.',
                            icon: 'success',
                            confirmButtonColor: '#35627A'
                        });
                    } else {
                        Swal.fire('Error', 'Failed to remove operator.', 'error');
                    }
                } catch (error) { console.error("Error deleting driver:", error); }
            }
        });
    }

    loadDrivers();
</script>
</body>
</html>
